# Evidence-following experiment, FLIP arm: this arm's edited copy of the
# reports (outside Git; see the experiment README). Identical to
# config/endometrial.yaml except `roster:` and the source `path:`.
# Attaches to an existing GLM server with --base-url.
task: ../../../tasks/endo_myometrial_invasion.yaml
mode: agentic
roster: ../inputs/flip/roster.csv
roster_column: unit

sources:
  - name: pathology_report
    path: /net/spaces/annawoodard/oncotrace/workspaces/khyatt/analysis/issue8/inputs/flip/ucec_pathology_report.jsonl

model:
  served_name: glm-5.3-flash
  temperature: 0.0
  top_p: 1.0
  extra_body:
    chat_template_kwargs:
      enable_thinking: true
      reasoning_effort: max

limits:
  model_calls: 24
  completion_passes: 2
  max_completion_tokens: 8192
  request_timeout_seconds: 1800

retrieval:
  max_read_chars: 18000

# Let teammates in __oncotrace read the run records, so they can rerun the analysis.
artifacts:
  group_readable: true
