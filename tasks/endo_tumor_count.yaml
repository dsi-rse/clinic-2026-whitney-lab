# How many separate tumors an endometrial carcinoma pathology report describes.
# DRAFT: first step of issue #50 (keep separate records when a report describes
# multiple tumors). This task only COUNTS. It does not extract invasion or depth;
# that is a later step, run once per tumor.
#
# Why count first: the invasion task gives one answer per patient, so a second
# tumor is silently dropped (seen on a patient whose report describes two foci).
# This count flags the patients that need per-tumor handling.
#
# `unclear` is a real answer here. It is the answer whenever the report does not
# settle the count, and also when the count depends on a rule the project has not
# decided yet (a tumor in another organ; a gross description that disagrees with
# the final diagnosis; a "separate" nodule). It is NOT pooled with
# `no_tumor_described` or with an error.
name: endo_tumor_count

label:
  field: tumor_count
  values:
    # The report describes exactly one tumor, even if it names several locations.
    - one_tumor
    # The report says there is more than one tumor.
    - multiple_tumors
    # The count cannot be settled from the report, or depends on an undecided rule.
    - unclear
    # The report describes no tumor at all. Absence cannot be quoted, so this
    # value is in no_quote_values below.
    - no_tumor_described

confidence_values: [high, medium, low]

# Every answer carries the quotes behind it (OncoTrace's per-answer quotes,
# dsi-rse/oncotrace#13). A value that only says something was absent from the
# report needs no quote, because absence cannot be quoted.
no_quote_values: [no_tumor_described]

list_fields: [tumor_locations, unresolved_conflicts]

instructions: |
  Decide how many separate tumors this patient's endometrial carcinoma pathology
  report describes. Answer only the count. Do not assess myometrial invasion or
  depth.

  Set tumor_count to one of:
  - one_tumor: the report describes exactly one tumor. One tumor may span several
    locations, for example from the uterine body into the lower uterine segment.
  - multiple_tumors: the report says there is more than one tumor: it gives a
    number above one, or describes distinct separate tumors.
  - unclear: you cannot tell. Use it when the report mentions more than one
    tumor-like area and does not say whether they are one tumor or several, when
    a separate tumor in another organ is involved, when the report calls a nodule
    "separate" without saying it arose independently of the main tumor, or when
    the gross description and the final diagnosis disagree about the count. Say why in
    unresolved_conflicts. Do not guess. If you record a disagreement about the
    count in unresolved_conflicts, the answer is unclear: do not settle it
    yourself.
  - no_tumor_described: the report describes no tumor.

  Count carcinoma only. A fibroid (leiomyoma), polyp, cyst, metastasis or
  lymph-node deposit is not a tumor for this count. A mixed carcinoma (one tumor
  with two cell types) is one tumor. A form label such as "additional tumor
  dimensions" is not a second tumor. Anchor on the definitive hysterectomy
  report, not a frozen section or a prior biopsy.

  tumor_locations lists each tumor location the report names, as short phrases
  in the report's own words. Leave it empty only when the report names none.

  This patient's source is ONE document holding their whole report: every page
  of the scan stitched in order, with page boundaries marked as
  "===== PAGE n =====". The inventory gives its length in document_chars. These
  reports are short -- a median of about 6,400 characters -- so read the whole
  document before reasoning, rather than deciding from search snippets.

  A citation is a verbatim quote from that document, and every quote must be
  inside a range you actually read. Quote the sentence that carries the decisive
  wording. Each answer carries its own quotes; when one passage supports two
  answers, quote it under both.

  Record each statement in the report that disagrees about the count as an entry
  in unresolved_conflicts, saying briefly what disagrees, and quote the passage.
  Leave it empty when nothing conflicts.

  These reports are OCR'd scans written between roughly 2000 and 2013. Where OCR
  has plainly garbled the wording that decides the count, prefer unclear over a
  guess, and quote the passage that is unreadable.
