# How many separate tumors an endometrial carcinoma pathology report describes.
# DRAFT: first step of issue #50 (keep separate records when a report describes
# multiple tumors). This task only COUNTS. It does not extract invasion or depth;
# that is a later step, run once per tumor.
#
# The count is the hard part, because location alone does not give it:
#   - one tumor can extend from the uterine body into the lower uterine segment
#     (ICCR 2024, Note 4, page 7), so two locations may still be one tumor;
#   - a report can name two locations without saying how they relate, and then
#     the honest answer is `unclear`, not a guess in either direction.
# So `unclear` is a real answer here. It is NOT pooled with `no_tumor_described`
# or with an error (CLAUDE.md § 5).
#
# The four made-up reports in issue #50 map onto the label like this:
#   two tumors, separate depths           -> multiple_tumors
#   two tumors, one unassigned depth      -> multiple_tumors
#   one tumor across two locations        -> one_tumor (both locations listed)
#   locations given, relation not stated  -> unclear (both locations listed)
name: endo_tumor_count

label:
  field: tumor_count
  values:
    # The report describes exactly one tumor, even if it names several locations
    # for it ("a single tumor extends from the fundus into the lower segment").
    - one_tumor
    # The report says the tumors are separate: states a number above one, or
    # describes distinct tumors ("two separate tumors", "a second tumor").
    - multiple_tumors
    # The report mentions more than one location or tumor-like area and does not
    # say whether they are one tumor or several.
    - unclear
    # The report describes no tumor at all (no carcinoma identified). Absence
    # cannot be quoted, so this value is in no_quote_values below.
    - no_tumor_described

confidence_values: [high, medium, low]

# Every answer carries the quotes behind it (OncoTrace's per-answer quotes,
# dsi-rse/oncotrace#13). one_tumor, multiple_tumors and unclear each quote the
# wording that decides the count. A value that only says something was absent
# from the report needs no quote, because absence cannot be quoted.
no_quote_values: [no_tumor_described, not_stated, none_stated]

extra_fields:
  # How the count was reached. Kept separate from the label so the metrics can
  # show whether errors come from reading an explicit statement or from the model
  # inferring a count from locations. It is recorded only: no rule below forces
  # it to match the label, because reports almost never say "single tumor".
  - name: count_basis
    values:
      # The report states a number or says "single" / "multiple" outright.
      - explicit_count_stated
      # No number, but the report describes distinct tumors one after another.
      - separate_tumors_described
      # One tumor is described, with no mention of any other.
      - single_tumor_described
      # Locations are named but their relation is not stated. Pairs with unclear.
      - locations_without_relation
      - not_stated

list_fields: [tumor_locations, unresolved_conflicts]

rules:
  # The three rules that tied count_basis to the label were removed in v2: the
  # first trial showed reports almost never state "single tumor", so the rule
  # for one_tumor forced a basis the report does not give.

  # Keep every location the report names, so a later per-tumor step can use them.
  - signature: unclear_keeps_locations
    message: unclear must keep the locations the report names
    when_label: [unclear]
    require_list:
      field: tumor_locations
      min_items: 1

instructions: |
  Decide how many separate tumors this patient's endometrial carcinoma pathology
  report describes. Answer only the count. Do not assess myometrial invasion or
  depth.

  Set tumor_count to one of:
  - one_tumor: the report describes exactly one tumor. A single tumor may extend
    across more than one location, for example from the uterine body into the
    lower uterine segment. That is still one tumor, and tumor_locations lists
    every location.
  - multiple_tumors: the report says there is more than one tumor. It gives a
    number above one, or describes distinct tumors ("two separate tumors", "a
    second tumor").
  - unclear: the report names more than one location, or more than one
    tumor-like area, and does not say whether they are one tumor or several.
    Do not guess: two locations alone do not tell you how many tumors there are.
  - no_tumor_described: the report describes no tumor.

  Set count_basis to how you reached the count:
  explicit_count_stated when the report states a number or says "single" or
  "multiple"; separate_tumors_described when it describes distinct tumors with no
  number; single_tumor_described when it describes one tumor and mentions no
  other; locations_without_relation when locations are named and their relation
  is not stated; not_stated when none of these applies.

  What counts as a tumor:
  - Count carcinoma only. A leiomyoma (fibroid), a polyp or a cyst is benign and
    is not a tumor for this count, even when the report calls it a "tumor" or a
    "mass".
  - A mixed carcinoma (one tumor with two cell types, for example endometrioid
    plus serous) is ONE tumor.
  - Count endometrial carcinoma only. A tumor in another organ, such as an
    implant on the cervix or a separate ovarian cancer, is not counted.
  - Separate tumors do not touch each other and arose independently. Tumor
    tissue that continues from one place to another is one tumor.
  - A label in a report form, such as "additional tumor dimensions", is a
    template field and does not mean a second tumor exists.
  - If the report calls a nodule "separate" (for example deep in the myometrium)
    without saying that it arose independently of the main tumor, answer
    unclear.

  tumor_locations lists each tumor location the report names, as short phrases
  in the report's own words ("fundus", "lower uterine segment"). Leave it empty
  only when the report names none. Quote the wording that gives the locations.

  Anchor on the definitive hysterectomy pathology report, not a frozen section or
  a prior biopsy. Count tumors in this specimen only. Do not count a metastasis,
  a lymph-node deposit, or an adenomyosis focus as a separate endometrial tumor.

  The report has a gross description (what the pathologist sees by eye) and a
  final diagnosis (the conclusion after the microscope). When they disagree about
  the number of tumors, the final diagnosis decides the count. Record the
  disagreement in unresolved_conflicts and quote both passages.

  This patient's source is ONE document holding their whole report: every page
  of the scan stitched in order, with page boundaries marked as
  "===== PAGE n =====". The inventory gives its length in document_chars. These
  reports are short -- a median of about 6,400 characters -- so read the whole
  document before reasoning, rather than deciding from search snippets.

  A citation is a verbatim quote from that document, and every quote must be
  inside a range you actually read. Quote the sentence that carries the decisive
  wording. Each answer carries its own quotes; when one passage supports two
  answers, quote it under both.

  When the report contradicts itself about the number of tumors, answer from the
  definitive statement and quote it under that answer. Record each conflicting
  statement as an entry in unresolved_conflicts, saying briefly what disagrees,
  and quote the conflicting passage there. Leave unresolved_conflicts empty when
  nothing conflicts.

  These reports are OCR'd scans written between roughly 2000 and 2013. Where OCR
  has plainly garbled the wording that decides the count, prefer unclear over a
  guess, and quote the passage that is unreadable.

  Complete these targeted checks before submitting:
  1. locate the definitive hysterectomy diagnosis;
  2. look for an explicit number or the words single, multiple, separate,
     synchronous, or "second tumor";
  3. list every tumor location the report names;
  4. decide whether the report says those locations are one tumor or several;
  5. check for a conflicting or superseded statement of the count.
